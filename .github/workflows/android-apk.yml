name: Build CoefficientReader APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key (when repository secrets are configured)
        if: ${{ secrets.CR_KEYSTORE_BASE64 != '' }}
        env:
          CR_KEYSTORE_BASE64: ${{ secrets.CR_KEYSTORE_BASE64 }}
          CR_KEYSTORE_PASSWORD: ${{ secrets.CR_KEYSTORE_PASSWORD }}
          CR_KEY_ALIAS: ${{ secrets.CR_KEY_ALIAS }}
          CR_KEY_PASSWORD: ${{ secrets.CR_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/coefficientreader-release.jks"
          printf '%s' "$CR_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "CR_SIGNING_ENABLED=true"
            echo "CR_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "CR_KEYSTORE_PASSWORD=$CR_KEYSTORE_PASSWORD"
            echo "CR_KEY_ALIAS=$CR_KEY_ALIAS"
            echo "CR_KEY_PASSWORD=$CR_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coefficient-reader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
